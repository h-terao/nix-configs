name: format

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nixfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix fmt
        run: nix fmt

      - name: Check for formatting changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::nix fmt changed files. Run 'nix fmt' locally and commit the result."
            exit 1
          fi
