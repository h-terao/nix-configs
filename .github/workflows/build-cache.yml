name: Build and cache NixOS

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cache-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ false }} # Builds are disabled.
    name: Build ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - host: hippo
            runner: ubuntu-latest
          - host: quetzal
            runner: ubuntu-latest
          - host: zapus
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check Cachix credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Set the CACHIX_AUTH_TOKEN repository secret to a token with write access to h-terao."
            exit 1
          fi

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: h-terao
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build NixOS configuration
        env:
          NIXOS_HOST: ${{ matrix.host }}
        run: |
          nix build --no-link --print-build-logs --no-update-lock-file \
            ".#nixosConfigurations.${NIXOS_HOST}.config.system.build.toplevel"
