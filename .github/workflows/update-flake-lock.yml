name: update flake.lock

on:
  schedule:
    # GitHub Actions schedules use UTC. 17:00 UTC is 02:00 JST the next day.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.pull-request.outputs.pull-request-number }}
      head-sha: ${{ steps.pull-request.outputs.pull-request-head-sha }}
      pr-operation: ${{ steps.pull-request.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - uses: peter-evans/create-pull-request@v8
        id: pull-request
        with:
          token: ${{ secrets.PAT }}
          add-paths: flake.lock
          branch: automation/update-flake-lock
          commit-message: Update flake.lock
          delete-branch: true
          title: Update flake.lock
          body: |
            Automated daily update of the flake inputs.

  build:
    needs: update
    if: >-
      needs.update.outputs.pr-number != '' &&
      (needs.update.outputs.pr-operation == 'created' ||
       needs.update.outputs.pr-operation == 'updated')
    uses: ./.github/workflows/build-cache.yml
    with:
      ref: ${{ needs.update.outputs.head-sha }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  auto-merge:
    needs: [update, build]
    if: needs.update.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.update.outputs.pr-number }}
          HEAD_SHA: ${{ needs.update.outputs.head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$HEAD_SHA"
